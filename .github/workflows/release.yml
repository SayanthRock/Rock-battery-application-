name: Release Application

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release (APK + Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint and typecheck Web
        run: npm run lint

      - name: Build Web production bundle
        run: npm run build

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 35 & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Package Web Distribution
        run: |
          mkdir -p release-assets
          cp -r dist rock-battery-web-dist
          zip -r release-assets/rock-battery-${{ steps.vars.outputs.tag }}-web-bundle.zip rock-battery-web-dist
          tar -czf release-assets/rock-battery-${{ steps.vars.outputs.tag }}-web-bundle.tar.gz rock-battery-web-dist

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "../release-assets/rock-battery-${{ steps.vars.outputs.tag }}.apk"
            echo "Successfully generated APK: ../release-assets/rock-battery-${{ steps.vars.outputs.tag }}.apk"
          else
            echo "Error: No APK found after Gradle build!"
            exit 1
          fi

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Rock Battery ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/rock-battery-${{ steps.vars.outputs.tag }}.apk
            release-assets/rock-battery-${{ steps.vars.outputs.tag }}-web-bundle.zip
            release-assets/rock-battery-${{ steps.vars.outputs.tag }}-web-bundle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
