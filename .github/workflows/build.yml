name: Build and Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build & Lint Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint and typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK Environment
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_PATH" > android/local.properties
          sudo chown -R $USER:$USER "$SDK_PATH" || true
          mkdir -p "$SDK_PATH/licenses" || true
          cat << 'EOF' > "$SDK_PATH/licenses/android-sdk-license"
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          84831b9409646a3e8e447b7a822e8884d9620857
          601085b94cd77f0b54ff864069570991500085d7
          33b6a2b64920221fa4f786982d38f80479a37bde
          e9acab587f418c2b542490f4e24d6e73e2c370f2
          EOF
          cat << 'EOF' > "$SDK_PATH/licenses/android-sdk-preview-license"
          893fb8b79d0e59c2452973695878ff59d750d089
          EOF
          cat << 'EOF' > "$SDK_PATH/licenses/android-sdk-arm-dbt-license"
          79397e3ac4620f49173dd592b604e18b143fa6d3
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rock-battery-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
